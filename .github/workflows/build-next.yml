name: Build DroidDesk Next

on:
  push:
    branches: [droiddesk-next]
    paths:
      - "build/**"
      - "next/**"
      - ".github/workflows/build-next.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout DroidDesk Next
        uses: actions/checkout@v4
        with:
          ref: droiddesk-next

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch DroidDesk Enhanced base
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/techjarves/DroidDesk-Enhanced.git /tmp/droiddesk-next

      - name: Apply Linux compatibility fixes
        run: |
          python3 build/patch_upstream.py /tmp/droiddesk-next

      - name: Apply MATE and recovery fixes
        run: |
          python3 build/patch_mate.py /tmp/droiddesk-next

      - name: Add DroidDesk Next source
        run: |
          cp next/NextManager.kt /tmp/droiddesk-next/app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/NextManager.kt
          cp next/DroidDeskNotificationListener.kt /tmp/droiddesk-next/app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/DroidDeskNotificationListener.kt
          cp next/next_center_screen.dart /tmp/droiddesk-next/app/lib/screens/next_center_screen.dart

      - name: Apply DroidDesk Next layer
        run: |
          python3 build/patch_next.py /tmp/droiddesk-next

      - name: Apply startup loop fixes
        run: |
          python3 build/patch_startup_v201.py /tmp/droiddesk-next

      - name: Apply repository resilience fixes
        run: |
          python3 build/patch_repo_resilience_v202.py /tmp/droiddesk-next

      - name: Replace JetBrains Mono assets
        run: |
          set -euxo pipefail
          FONT_DIR="/tmp/droiddesk-next/app/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"             -o "$FONT_DIR/JetBrainsMono-Regular.ttf"
          cp "$FONT_DIR/JetBrainsMono-Regular.ttf" "$FONT_DIR/JetBrainsMono-Bold.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Regular.ttf"

      - name: Flutter dependencies
        working-directory: /tmp/droiddesk-next/app
        run: flutter pub get

      - name: Static analysis
        working-directory: /tmp/droiddesk-next/app
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: /tmp/droiddesk-next/app
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="/tmp/droiddesk-next/app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DroidDesk-Next-v2.0.2.apk
          sha256sum DroidDesk-Next-v2.0.2.apk > DroidDesk-Next-v2.0.2.sha256

      - name: Publish DroidDesk Next
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin droiddesk-next
          git add DroidDesk-Next-v2.0.2.apk DroidDesk-Next-v2.0.2.sha256
          git commit -m "Add DroidDesk Next v2.0.2 APK"
          git push origin HEAD:droiddesk-next
