name: Build DroidDesk Next

on:
  push:
    branches: [droiddesk-next]
    paths:
      - "build/**"
      - "next/**"
      - ".github/workflows/build-next.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout DroidDesk Next
        uses: actions/checkout@v4
        with:
          ref: droiddesk-next

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch DroidDesk Enhanced base
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/techjarves/DroidDesk-Enhanced.git /tmp/droiddesk-next

      - name: Apply Linux compatibility fixes
        run: |
          python3 build/patch_upstream.py /tmp/droiddesk-next

      - name: Apply MATE and recovery fixes
        run: |
          python3 build/patch_mate.py /tmp/droiddesk-next

      - name: Add DroidDesk Next source
        run: |
          cp next/NextManager.kt /tmp/droiddesk-next/app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/NextManager.kt
          cp next/DroidDeskNotificationListener.kt /tmp/droiddesk-next/app/android/app/src/main/kotlin/com/orailnoor/droiddesk/runtime/DroidDeskNotificationListener.kt
          cp next/next_center_screen.dart /tmp/droiddesk-next/app/lib/screens/next_center_screen.dart

      - name: Apply DroidDesk Next layer
        run: |
          python3 build/patch_next.py /tmp/droiddesk-next

      - name: Apply startup loop fixes
        run: |
          python3 build/patch_startup_v201.py /tmp/droiddesk-next

      - name: Apply repository resilience fixes
        run: |
          python3 build/patch_repo_resilience_v202.py /tmp/droiddesk-next

      - name: Add Ember asset
        run: |
          mkdir -p /tmp/droiddesk-next/app/assets/ember
          cp next/ember_server.py /tmp/droiddesk-next/app/assets/ember/ember_server.py
          test -s /tmp/droiddesk-next/app/assets/ember/ember_server.py

      - name: Apply v2.0.3 Linux integration
        run: |
          python3 build/patch_v203_linux.py /tmp/droiddesk-next

      - name: Apply v2.0.3 Android integration
        run: |
          python3 build/patch_v203_android.py /tmp/droiddesk-next

      - name: Apply v2.0.4 repository newline validation
        run: |
          python3 build/patch_v204_repo_newline.py /tmp/droiddesk-next

      - name: Package native Ember for DroidDesk
        run: |
          set -euxo pipefail
          mkdir -p /tmp/droiddesk-next/app/assets/desktop
          mkdir -p /tmp/droiddesk-next/app/assets/ember
          cp next/droiddesk_files.py /tmp/droiddesk-next/app/assets/desktop/droiddesk_files.py
          cp next/import_center.py /tmp/droiddesk-next/app/assets/desktop/import_center.py
          rm -rf /tmp/ember-native
          git clone --depth 1 https://github.com/chaukentsakiso55-a11y/ember.git /tmp/ember-native
          python3 build/patch_ember_android.py /tmp/ember-native
          rm -rf /tmp/ember-native/.git
          rm -f /tmp/ember-native/.env
          rm -f /tmp/ember-native/config/provider_secrets.json
          rm -f /tmp/ember-native/config/api_keys.json
          mkdir -p /tmp/ember-native/vendor
          python3 -m pip install --disable-pip-version-check --no-compile --no-binary=:all: \
            --target /tmp/ember-native/vendor \
            requests certifi idna urllib3 charset_normalizer
          cd /tmp/ember-native
          zip -qr /tmp/droiddesk-next/app/assets/ember/ember-native.zip .
          test -s /tmp/droiddesk-next/app/assets/ember/ember-native.zip

      - name: Apply v2.0.5 Android bridge
        run: |
          python3 build/patch_v205_android.py /tmp/droiddesk-next

      - name: Apply v2.0.5 desktop integration
        run: |
          python3 build/patch_v205_linux.py /tmp/droiddesk-next

      - name: Replace JetBrains Mono assets
        run: |
          set -euxo pipefail
          FONT_DIR="/tmp/droiddesk-next/app/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"             -o "$FONT_DIR/JetBrainsMono-Regular.ttf"
          cp "$FONT_DIR/JetBrainsMono-Regular.ttf" "$FONT_DIR/JetBrainsMono-Bold.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Regular.ttf"

      - name: Flutter dependencies
        working-directory: /tmp/droiddesk-next/app
        run: flutter pub get

      - name: Static analysis
        working-directory: /tmp/droiddesk-next/app
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: /tmp/droiddesk-next/app
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="/tmp/droiddesk-next/app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DroidDesk-Next-v2.0.5.apk
          sha256sum DroidDesk-Next-v2.0.5.apk > DroidDesk-Next-v2.0.5.sha256

      - name: Publish DroidDesk Next
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DroidDesk-Next-v2.0.5.apk DroidDesk-Next-v2.0.5.sha256
          git commit -m "Add DroidDesk Next v2.0.5 APK"
          git pull --rebase origin droiddesk-next
          git push origin HEAD:droiddesk-next
