name: Audit Desktop Installers

on:
  push:
    branches: [droiddesk-next]
    paths:
      - "audit/**"
      - ".github/workflows/audit-desktops.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: droiddesk-next
      - name: Validate current Termux desktop package graphs
        run: python3 audit/audit_desktops.py
      - name: Verify v2.0.3 APK structure
        run: |
          set -euxo pipefail
          test -s DroidDesk-Next-v2.0.3.apk
          unzip -tq DroidDesk-Next-v2.0.3.apk
          unzip -l DroidDesk-Next-v2.0.3.apk | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/" | head -n 20
          unzip -l DroidDesk-Next-v2.0.3.apk | grep -F "flutter_assets/assets/ember/ember_server.py"
          unzip -p DroidDesk-Next-v2.0.3.apk assets/flutter_assets/assets/ember/ember_server.py | grep -F "MARK LI control core"
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: droiddesk-desktop-audit
          path: desktop-audit.json
