name: Build DroidDesk Linux APK

on:
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout desk
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch DroidDesk Enhanced v1.0.1
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/techjarves/DroidDesk-Enhanced.git /tmp/droiddesk-upstream

      - name: Apply Linux fixes
        run: |
          python3 build/patch_upstream.py /tmp/droiddesk-upstream

      - name: Replace broken JetBrains Mono assets
        run: |
          set -euxo pipefail
          FONT_DIR="/tmp/droiddesk-upstream/app/assets/fonts"
          mkdir -p "$FONT_DIR"
          curl --fail --location --retry 3             "https://raw.githubusercontent.com/google/fonts/main/ofl/jetbrainsmono/JetBrainsMono%5Bwght%5D.ttf"             -o "$FONT_DIR/JetBrainsMono-Regular.ttf"
          cp "$FONT_DIR/JetBrainsMono-Regular.ttf" "$FONT_DIR/JetBrainsMono-Bold.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Regular.ttf"
          test -s "$FONT_DIR/JetBrainsMono-Bold.ttf"

      - name: Install dependencies
        working-directory: /tmp/droiddesk-upstream/app
        run: flutter pub get

      - name: Static analysis
        working-directory: /tmp/droiddesk-upstream/app
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: /tmp/droiddesk-upstream/app
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="/tmp/droiddesk-upstream/app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DroidDesk-Enhanced-Linux-Fixed-v1.0.2.apk
          sha256sum DroidDesk-Enhanced-Linux-Fixed-v1.0.2.apk > DroidDesk-Enhanced-Linux-Fixed-v1.0.2.sha256

      - name: Commit APK to desk
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DroidDesk-Enhanced-Linux-Fixed-v1.0.2.apk DroidDesk-Enhanced-Linux-Fixed-v1.0.2.sha256
          git commit -m "Add fixed DroidDesk Enhanced Linux APK"
          git push origin HEAD:main
